name: Update official campaign data

on:
  schedule:
    # Every four hours. GitHub cron uses UTC; this covers six checks per day in Asia/Taipei.
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-campaign-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scrape official campaign pages
        run: pnpm run update:campaigns

      - name: Commit changed campaign data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/data/campaigns.json; then
            echo "No campaign data changes."
            exit 0
          fi
          git add public/data/campaigns.json
          git commit -m "chore: refresh official campaign data"
          git push origin HEAD:main
